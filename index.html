<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nicman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=16" />
</head>
<body>
  <main class="app-shell">
    <section class="game-layout">
      <section class="board-wrap" aria-label="Nicman game board">
        <canvas id="game" width="588" height="588"></canvas>
        <div id="overlay" class="overlay">
          <h2 id="overlayTitle">Ready?</h2>
          <p id="overlayText">Use cursor keys. Numpad 8, 4, 2, 6 also work.</p>
          <button id="actionButton" type="button">Start Game</button>
          <form id="scoreSubmitForm" class="score-submit-form hidden" autocomplete="off">
            <div class="score-submit-row">
              <span class="score-submit-name">NAME:</span>
              <input id="playerName" name="playerName" type="text" maxlength="16" placeholder="PLAYER1" />
              <button id="submitScoreButton" type="submit">Submit</button>
            </div>
          </form>
          <section id="overlayLeaderboardPanel" class="overlay-leaderboard-panel" aria-label="Leaderboard in game over">
            <h3>Leaderboard</h3>
            <ol id="overlayLeaderboardList" class="leaderboard-list" aria-live="polite">
              <li class="leaderboard-empty">Loading scores...</li>
            </ol>
            <p id="overlayLeaderboardStatus" class="leaderboard-status"></p>
          </section>
        </div>
      </section>

      <aside class="side-panel" aria-label="Game info panel">
        <div class="hud-row">
          <h1 class="nicman-logo" aria-label="nicman">nicman</h1>
          <div class="stats">
            <p><span class="label">Score</span><span id="score">0</span></p>
            <p><span class="label">Lives</span><span id="lives">3UP</span></p>
            <p><span class="label">Level</span><span id="level">1</span></p>
          </div>
        </div>

        <section class="mobile-controls" aria-label="Mobile controls">
          <div id="joystick" class="joystick" aria-label="Virtual joystick" role="application">
            <div id="joystickKnob" class="joystick-knob"></div>
            <span class="joystick-label">Joystick</span>
          </div>
        </section>

        <section class="leaderboard-panel" aria-label="Leaderboard panel">
          <div class="leaderboard-header">
            <h2>Leaderboard</h2>
            <button id="refreshLeaderboard" type="button">Refresh</button>
          </div>
          <ol id="leaderboardList" class="leaderboard-list" aria-live="polite">
            <li class="leaderboard-empty">Loading scores...</li>
          </ol>
          <p id="leaderboardStatus" class="leaderboard-status"></p>
        </section>
      </aside>
    </section>
  </main>

  <script src="nicman-rules.js?v=7"></script>
  <script src="game.js?v=13"></script>
</body>
</html>
